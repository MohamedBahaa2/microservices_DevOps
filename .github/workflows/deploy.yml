name: Deploy react

on:

  push:

    branches:

      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v2

      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t mohamedbahaa2/react-test -f Dockerfile.dev .

      - run: docker run -e CI=true mohamedbahaa2/react-test npm run test
 
      - run: docker build -t mohamedbahaa2/multi-client ./client

      - run: docker build -t mohamedbahaa2/multi-nginx ./nginx

      - run: docker build -t mohamedbahaa2/multi-server ./server

      - run: docker build -t mohamedbahaa2/multi-worker ./worker
 
      - run: docker push mohamedbahaa2/multi-client 

      - run: docker push mohamedbahaa2/multi-nginx 

      - run: docker push mohamedbahaa2/multi-server 

      - run: docker push mohamedbahaa2/multi-worker 

 